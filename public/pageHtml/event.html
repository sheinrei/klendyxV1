<!DOCTYPE html>
<html lang="fr">



<head>
    <meta charset="UTF-8">
    <title>Créer un evenement Calendyx</title>
    <meta name="description"
        content="Liste de tous les services proposés par Calendyx, gérez votre emploi du temps en toute facilité.">

    <meta name="keywords" content="callendar, agenda, rendez-vous">
    <meta name="author" content="Sheinrei">

    <!-- Robots -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

    <!-- Canonical -->
    <link rel="canonical" href="https://calendyx/event">

    <!-- Extras utiles -->
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    <!-- Open Graph (pour le partage sur réseaux sociaux) -->
    <meta property="og:title" content="Retrouvez les services proposés par Calendyx">
    <meta property="og:description"
        content="Liste de tous les services proposés par Calendyx, gérez votre emploi du temps en toute facilité.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://calendyx/event">
    <meta property="og:image" content="https://www.example.com/image-de-la-page.jpg">
    <meta property="og:site_name" content="Calendyx">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Titre de la page - mot-clé principal">
    <meta name="twitter:description" content="Description de la page pour Twitter.">
    <meta name="twitter:image" content="https://www.example.com/image-de-la-page.jpg">
    <meta name="twitter:site" content="@Sheinrei">


    <!-- css -->
    <link rel="stylesheet" href="./../css/formCreateEvent.css">
    <link rel="stylesheet" href="./../css/modale/classiqueModale.css">
    <link rel="stylesheet" href="./css/generic.css">
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/footer.css">

    <!-- script -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous" defer></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
    <script src="./js/deconnectUser.js" defer></script>
    <script src="./js/logiqueFormCreateEvent.js" defer></script>
    <script src="./js/modale/classiqueModale.js" defer></script>
    <script src="./js/sessionExpire.js" defer></script>

</head>



<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1>Créer votre evenement</h1>
            </header>
            <section class="content-event">

                <section>

                    <form class="form-declanch-rdv" id="form-declanch-rdv">

                        <header>
                            <p class="title">Déclencher un rdv</p>
                            <p class="subtitle">Saisissez votre contacte et la methode d'envoie et declancher un
                                rendez-vous en toute simplicité</p>
                            <p id="message-alert"></p>
                        </header>


                        <div class="form-detail-client">
                            <p>Client :</p>

                            <div>
                                <label for="client-nom">Nom</label>
                                <input type="text" name="client-nom" id="client-nom">
                            </div>

                            <div>
                                <label for="client-prenom">Prenom</label>
                                <input type="text" name="client-prenom" id="client-prenom">
                            </div>
                        </div>


                        <div class="form-detail-envoi">
                            <p>Methode de contact</p>
                            <div>
                                <input type="checkbox" id="type-email" name="type-email">
                                <label for="type-email">Envoyer par email</label>
                                <br>
                                <input type="email" id="client-email" name="client-email"
                                    placeholder="exemple@domaine.com">
                            </div>

                            <div>
                                <input type="checkbox" id="type-sms" name="type-sms">
                                <label for="type-sms">Envoyer par sms</label>
                                <br>
                                <input type="text" placeholder="06 XX XX XX XX" id="client-phone" name="client-phone">
                            </div>

                        </div>


                        <div class="form-detail-rdv">
                            <p>Detail du rendez-vous</p>

                            <label for="date-debut">Date de debut</label>
                            <input type="datetime-local" name="date-debut" id="date-debut">

                            <label for="date-fin">date de fin</label>
                            <input type="datetime-local" name="date-fin" id="date-fin">


                            <label for="title-event">Motif du rdv</label>
                            <input type="text" placeholder="Rappel rdv coiffeur" name="title-event" id="title-event">

                            <label for="message-event">Ajouter un message</label>
                            <input type="text" placeholder="Message complémentaire" name="message-event"
                                id="message-event">
                        </div>

                        <button type="button" id="btn-submit-form-create-event">Créer le rdv et envoyer</button>

                    </form>
                </section>

                <section class="render-sending">
                    <header>
                        <p>Prévisulisation</p>

                        <p>Message envoyé à x destinataire</p>
                        <p>Methode d'envois : sms / email</p>

                        <p>Envoyé à :</p>
                    </header>
                </section>
            </section>
        </main>
    </section>
</body>

</html>
