<!DOCTYPE html>
<html lang="en">



<head>
    <title>Calendyx</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script src="./js/headConstruct.js"></script>
    <script src="./js/config.js"></script>

    <link rel="stylesheet" href="./../css/contactFav.css">
    <link rel="stylesheet" href="./../css/modale/classiqueModale.css">

</head>



<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1>Gestion de vos contacts en favori</h1>
                <p>Dans cette page vous pouvez organiser tout vos contact en favori</p>
            </header>


            <section class="frame-add-contact">

                <form action="">
                    <p>Ajouter un nouveau contact</p>

                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom">

                    <label for="prenom">Prenom :</label>
                    <input type="text" id="prenom" name="prenom">

                    <label for="email">Email :</label>
                    <input type="text" id="email" name="email">

                    <label for="nom">Phone :</label>
                    <input type="text" id="phone" name="phone">

                    <button id="btn-create-submit">Ajouter</button>
                </form>


            </section>

            <section>
                <p>Liste de tout vos contacts</p>
                <div>
                    <span>Nombre de contact à afficher : </span>
                    <select name="nombre-contact-affichage" id="nombre-contact-affichage">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>

                <label for="search-contact">Rechercher dans vos contact</label>
                <input type="text" id="search-contact" name="search-contact">

                <div id="frame-list-contact">
                    <div class="contact-row-header">
                        <p>Nom</p>
                        <p>Prenom</p>
                        <p>Email</p>
                        <p>Phone</p>
                        <p>Action</p>
                    </div>

                </div>
            </section>



        </main>
    </section>

    <script src="./js/config.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/deconnectUser.js"></script>




    <script src="./js/contactFav/createContact.js"></script>
    <script src="./js/contactFav/getContact.js"></script>
    <script src="./js/contactFav/deleteContact.js"></script>
    <script src="./js/contactFav/updateContact.js"></script>
    <script src="./js/modale/classiqueModale.js"></script>

</body>

</html>
