<!DOCTYPE html>
<html lang="fr">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titre & Description -->
    <title>Calendyx – Contacts favoris</title>
    <meta name="description"
        content="Organisez vos contacts favoris sur Calendyx pour accélérer la création d’événements et profiter d’une saisie automatique optimisée. Ajoutez, modifiez et retrouvez vos contacts facilement.">
    <meta name="keywords"
        content="contacts favoris, gestion de contacts, agenda, création rapide d’événements, Calendyx, saisie automatique">
    <meta name="author" content="Sheinrei">

    <!-- Robots -->
    <meta name="robots" content="noindex, follow">
    <meta name="googlebot" content="noindex, follow">

    <!-- Canonical -->
    <link rel="canonical" href="https://calendyx/contacts-favoris">

    <!-- Extras -->
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    <!-- Open Graph -->
    <meta property="og:title" content="Calendyx – Contacts favoris">
    <meta property="og:description"
        content="Organisez vos contacts favoris sur Calendyx pour accélérer la création d’événements et profiter d’une saisie automatique optimisée.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://calendyx/contacts-favoris">
    <meta property="og:image" content="https://www.example.com/image-contacts-favoris.jpg">
    <meta property="og:site_name" content="Calendyx">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Calendyx – Contacts favoris">
    <meta name="twitter:description"
        content="Organisez vos contacts favoris sur Calendyx pour accélérer la création d’événements et profiter d’une saisie automatique optimisée.">
    <meta name="twitter:image" content="https://www.example.com/image-contacts-favoris.jpg">
    <meta name="twitter:site" content="@Sheinrei">


    <!-- css -->
    <link rel="stylesheet" href="./css/contactFav.css">
    <link rel="stylesheet" href="./css/modale/classiqueModale.css">
    <link rel="stylesheet" href="./css/generic.css">
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/pageHeader.css">

    <!-- script -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous" defer></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
    <script src="./js/deconnectUser.js" defer></script>
    <script src="./js/modale/classiqueModale.js" defer></script>
    <script src="./js/contactFav/createContact.js" defer></script>
    <script src="./js/contactFav/getContact.js" defer></script>
    <script src="./js/contactFav/deleteContact.js" defer></script>
    <script src="./js/contactFav/updateContact.js" defer></script>
    <script src="./js/sessionExpire.js" defer></script>

</head>



<body>
    <section class="content" id="content">

        <main>
            <header>
                <div class="header-logo" style="margin-right: 20px;">
                    <img width="60" height="60" src="https://img.icons8.com/papercut/60/contact-card.png"
                        alt="contact-card" />
                </div>
                <div class="header-content">
                    <h1 class="header-title">Ajoutez des contacts dans vos favoris</h1>
                    <p class="header-subtitle">Ajouter des contacts en favoris pour acceder plus facilement à leurs informations dans Calendyx</p>
                </div>
            </header>



            <section class="frame-add-contact">

                <form action="">
                    <p class="add-contact-title">Ajouter un nouveau contact</p>

                    <span class="divider"></span>
                    <div class="input-row">
                        <label for="nom">Nom :</label>
                        <input type="text" id="nom" name="nom">
                    </div>

                    <div class="input-row">
                        <label for="prenom">Prenom :</label>
                        <input type="text" id="prenom" name="prenom">
                    </div>

                    <div class="input-row">
                        <label for="email">Email :</label>
                        <input type="text" id="email" name="email">
                    </div>

                    <div class="input-row">
                        <label for="nom">Telephone :</label>
                        <input type="text" id="phone" name="phone">
                    </div>
                    <button id="btn-create-submit">Ajouter</button>
                </form>


            </section>




            <section class="frame-contact-saved">
                <p class="frame-contact-title">Liste de tout vos contacts</p>

                <label for="search-contact">Rechercher dans vos contact</label>
                <div class="frame-searching">
                    <input type="text" id="search-contact" name="search-contact">
                    <div>
                        <select name="nombre-contact-affichage" id="nombre-contact-affichage">
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <div id="frame-list-contact">
                    <div class="contact-row-header">
                        <p>Nom</p>
                        <p>Prenom</p>
                        <p>Email</p>
                        <p>Phone</p>
                        <p>Action</p>
                    </div>

                </div>
            </section>



        </main>
    </section>
</body>

</html>
