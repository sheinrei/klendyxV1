<!DOCTYPE html>
<html lang="en">



<head>
    <title>Calendyx</title>

        <main>

            <section class="frame-add-contact">

                    <input type="text" id="prenom" name="prenom">

                    <label for="email">Email :</label>
                    <input type="text" id="email" name="email">

                    <label for="nom">Phone :</label>
                    <input type="text" id="phone" name="phone">
                </form>


            </section>

            <section>
                <p>Liste de tout vos contacts</p>
            </section>



        </main>
    </section>


    <script src="./js/navbar.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/deconnectUser.js"></script>


    <script>

        $("#nom").val()

        $("#nom").val()
