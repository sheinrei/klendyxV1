<!DOCTYPE html>
<html lang="fr">



<head>
    <meta charset="UTF-8">
    <title>Calendyx</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">




    <!-- CSS -->
    <link rel="stylesheet" href="/css/generic.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/forgotPassword.css">

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous" defer></script>
    <script src="/js/config.js" defer></script>
    <script src="/js/navbar.js" defer></script>
    <script src="/js/footer.js" defer></script>
    <script src="/js/deconnectUser.js" defer></script>
    <script src="/js/password/forgotPassword.js" defer></script>
    <script src="/js/sessionExpire.js" defer></script>


</head>



<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1>Réinitialiser le mot de passe</h1>
            </header>

            <div>
                <form class="forgot-password-card">

                    <header>
                        <p class="auth-title">Calendyx</p>
                        <p class="auth-subtitle">Indiquez l’adresse e-mail associée à votre compte.</p>
                    </header>

                    <p id="message-alert-success"></p>
                    <p id="message-alert-warning"></p>

                    <div class="frame-input">
                        <label for="email">Adresse e-mail</label>
                        <input id="email" name="email" type="email" required autocomplete="email"
                            placeholder="exemple@domaine.com" aria-describedby="email-help">
                    </div>

                    <div class="email-help">
                        Nous enverrons un lien si l’adresse est enregistrée. (Regardez les spams si tu ne reçois rien.)
                    </div>


                    <div class="footer-form">
                        <button id="submit-forgot-password" class="btn btn-primary">Envoyer la demande</button>
                        <a href="/connexion" class="a-nav">Retour à la connexion</a>
                    </div>

                </form>
            </div>
        </main>
    </section>
</body>

</html>
