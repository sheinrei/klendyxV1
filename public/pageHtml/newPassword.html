<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Réinitialisation de mot de passe - Calendyx</title>
    <meta name="description" content="Calendyx gérez votre emploi du temps en toute facilité.">

    <meta name="keywords" content="callendar, agenda, rendez-vous">
    <meta name="author" content="Sheinrei">

    <!-- Robots -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">


    <!-- Extras utiles -->
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">


    <!-- css -->
    <link rel="stylesheet" href="/css/generic.css">
    <link rel="stylesheet" href="/css/newPassword.css">

    <!-- script -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="/js/password/forcePassword.js" defer></script>
    <script src="/js/config.js" defer></script>

</head>

<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1 class="title">Nouveau mot de passe</h1>
        <p class="subtitle">Choisis un mot de passe sécurisé pour ton compte</p>
        <p id="message-alert-password"></p>

        <form>
            <div class="input-group">
                <label for="new-password">Mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="new-password" name="new-password"
                        placeholder="Saisis ton nouveau mot de passe" required minlength="8" />
                </div>


                <label for="new-password-confirm">Confirmer mot de passe</label>
                <div class="input-wrapper">
                    <input type="password" id="new-password-confirm" name="new-password-confirm"
                        placeholder="Confirme le nouveau mot de passe" required minlength="8" />
                </div>
                <progress max="100" value="0" id="strength-bar"></progress>
            </div>

            <div class="password-requirements">
                <strong>Le nouveau mot de passe doit contenir :</strong>
                <ul>
                    <li>Au moins 8 caractères</li>
                    <li>Une lettre majuscule et une minuscule</li>
                    <li>Un chiffre</li>
                    <li>Un caractère spécial (@, #, $, etc.)</li>
                </ul>
            </div>

            <button id="btn-submit">
                Réinitialiser le mot de passe
            </button>
        </form>

    </div>
</body>



<script>

    $(async function () {

        const config = await getConfig()
        const host = config.host

        const url = window.location.href;

        const token = url.split("/")[6];
        const id = url.split("/")[7];


        $("#btn-submit").on("click", async function (e) {
            e.preventDefault();
            const password = $('#new-password').val()

            if ($("#new-password").val() !== $("#new-password-confirm").val()) {
                $("#message-alert-password").text("Les deux mots de passes ne correspondent pas.")
                return
            }

            if ($("#new-password").val() === $("#new-password-confirm").val() && $("#strength-bar").val() === 100) {

                const res = await fetch(`${host}/api/user/resetpassword/${token}/${id}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password })
                });

                const data = await res.json()
                if (data.success) {
                    $("#message-alert-password").css("color", "green")
                    $("#message-alert-password").html(data.message);
                    setTimeout(() => window.location.href = `${host}/connexion`, 5500)
                    return
                }


            }
            $("#message-alert-password").text("Erreur surveunu avec le serveur")
        })

    })

</script>

</html>
