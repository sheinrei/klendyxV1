<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1>Planifiez et Suivez vos Rendez-vous</h1>

                <p>Si ce n'est pas déjà fait vous pouvez synchroniser vos agenda google et apple sur votre <a
                        href="/mon-compte#frame-sync-calendar">gestion de compte</a></p>

                <div id="message-alert">

                </div>
            </header>


            <div class="frame-calendar">
                <div id="calendar"></div>


                <div class="calendar-tools">
                    <div id="external-events">
                        <p><strong>Événements prédéfinis</strong></p>
                        <div class="fc-event" id="summary-reunion" value="Réunion">Réunion</div>
                        <div class="fc-event" id="summary-pauseCafe" value="Pause café">Pause café</div>
                        <div class="fc-event" id="summary-appelClient" value="Appel client">Appel client</div>
                        <div>
                            <input type="checkbox" id="drop-remove" />
                            <label for="drop-remove">Supprimer après drop</label>
                        </div>
                    </div>


                    <div id="create-event">
                        <form action="">
                            <p>Ajouter un evenmeent dans votre Agenda</p>
                            <label for="title-event">Titre</label>
                            <input type="text" id="title-event" name="title-event">

                            <label for="description">Description</label>
                            <input type="text" name="description" id="description">


                            <label for="start-time">Date de début</label>
                            <input type="datetime-local" name="start-time" id="start-time">

                            <label for="end-time">Date de fin</label>
                            <input type="datetime-local" name="end-time" id="end-time">

                            <button id="submit-create-event">Créer l'evenement</button>
                        </form>

                    </div>

                    <div id="match-event">
                        <!--                         <p>
                            Définir un rdv integligeant. Donner vos disponibilité et la liste de contact et Calendyx se chargera de 
                            trouver le meilleur moment pour vous synchroniser
                        </p> -->
                        <form action="">

                            <label for="event-title">Titre du rdv</label>
                            <input type="text" id="event-title" name="event-title">

                            <label for="event-adress">Lieux du rdv</label>
                            <input type="text" id="event-adress" name="event-adress">

                            <label for="event-describe">Description</label>
                            <input type="text" id="event-describe" name="event-describe"
                                placeholder="Valider le devis de Mr-Jean">


                            <label for="">Destinataire (email)</label>
                            <input type="email" id="input-email-contact" required>
                            <button id="btn-add-contact">Ajouter le destinataire</button>

                            <ul id="list-contact-send">Liste des destinataires :
                            </ul>

                            <label for="event-duration">Duré du rdv</label>
                            <div class="form-block">
                                <input type="number" id="event-duration" name="event-duration">
                                <span>heure</span>
                            </div>


                            <label for="">Selectionner vos dates dispo</label>

                            <label for="range-min">date debut</label>
                            <input type="date" id="range-min" name="range-min">

                            <label for="range-max">date de fin</label>
                            <input type="date" id="range-max" name="range-max">

                            <button id="btn-submit-matching-event">Valider</button>
                        </form>
                    </div>
                </div>



            </div>
        </main>
    </section>


</body>
