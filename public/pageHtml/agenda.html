<!DOCTYPE html>
<html lang="en">



<head>
    <title>Calendyx</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script src="./js/headConstruct.js"></script>
    <link rel="stylesheet" href="./../css/calendar.css">

    <!-- <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script> -->
    <script src="./js/cdnFullCalendar.js"></script>
</head>



<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1>Retrouvez tout les services proposé par Calendyx</h1>
            </header>


            <div class="frame-calendar">
                <div id="calendar"></div>


                <div class="calendar-tools">
                    <div id="external-events">
                        <p><strong>Événements prédéfinis</strong></p>
                        <div class="fc-event">Réunion</div>
                        <div class="fc-event">Pause café</div>
                        <div class="fc-event">Appel client</div>
                        <div>
                            <input type="checkbox" id="drop-remove" />
                            <label for="drop-remove">Supprimer après drop</label>
                        </div>
                    </div>


                    <div id="create-event">
                        <form action="">
                            <p>Ajouter un evenmeent dans votre Agenda</p>
                            <label for="title-event">Titre</label>
                            <input type="text" id="title-event" name="title-event">

                            <label for="description">Description</label>
                            <input type="text" name="description" id="description">


                            <label for="start-time">Date de début</label>
                            <input type="datetime-local" name="start-time" id="start-time">

                            <label for="end-time">Date de fin</label>
                            <input type="datetime-local" name="end-time" id="end-time">

                            <button id="submit-create-event">Créer l'evenement</button>
                        </form>

                    </div>
                </div>



            </div>
        </main>
    </section>


</body>



<script src="./js/tools.js"></script>
<script src="./js/config.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/deconnectUser.js"></script>
<script src="./js/calendar/implemente.js"></script>
<script src="./js/calendar/modaleDetailEvent.js"></script>
<script src="./js/calendar/createEvent.js"></script>
<script src="./js/calendar/deleteEvent.js"></script>


</html>
