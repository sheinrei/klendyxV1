<!DOCTYPE html>
<html lang="fr">



<head>
    <meta charset="UTF-8">
    <title>Klendyx - Tableau de bord</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./../images/litleLogo.png">

    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>


    <!-- css -->
    <link rel="stylesheet" href="./../css/dashboard.css">
    <link rel="stylesheet" href="./../css/modale/classiqueModale.css">
    <link rel="stylesheet" href="./css/generic.css">
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/footer.css">


    <!-- script -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="./js/config.js"></script>
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
    <script src="./js/deconnectUser.js" defer></script>
    <script src="./js/tools.js"></script>
    <script src="./js/dashboard/dashboardDOM.js" type="module" defer></script>
    <script src="./js/modale/classiqueModale.js" defer></script>
    <script src="./js/sessionExpire.js" defer></script>


</head>




<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1 class="title">Tableau de bord</h1>
                <p>Retrouvez toute les statistiques de vos événements</p>
            </header>



            <section class="frame-row">
                <!-- credit -->
                <section class="frame-abonnement">
                    <div class="card">
                        <p>Plan d'abonnement :
                            <span id="user-abonnement"></span>
                        </p>
                    </div>
                </section>

                <!-- Agenda sync-->
                <section class="frame-calendar">
                    <div class="card">
                        <p>Vos Agendas Synchronisés</p>

                        <div class="main-frame-row">
                            <div>
                                <div class="card-row">
                                    <img width="38" height="38" src="https://img.icons8.com/fluency/48/google-logo.png"
                                        alt="google-logo">
                                    <span id="user-calendar-sync-google"></span>
                                </div>

                                <div class="card-row">
                                    <img width="38" height="38"
                                        src="https://img.icons8.com/fluency/48/microsoft-outlook-2019.png"
                                        alt="microsoft-outlook-2019">
                                    <span id="user-calendar-sync-outlook"></span>
                                </div>

                                <div class="card-row">
                                    <img width="38" height="38" src="https://img.icons8.com/fluency/50/mac-os.png"
                                        alt="mac-os">
                                    <span id="user-calendar-sync-apple"></span>
                                </div>
                            </div>

                            <div class="graph-wrapper">
                                <canvas id="ctx-calendar-count" class="graph"></canvas>
                            </div>

                        </div>
                    </div>
                </section>

                <section class="frame-graph-envoie">
                    <div class="card">
                        <p>Envoies de sms et email</p>
                        <div class="graph-wrapper">
                            <canvas id="graph-envoie" class="graph"></canvas>
                        </div>
                    </div>

                </section>

            </section>

            <secttion class="frame-row">
                <!-- graph envoie sms/email-->
                <section>

                    <div class="card">
                        <p>Proposition de rendez-vous</p>
                        <div class="graph-wrapper">
                            <canvas id="graph-proposition-rdv" class="graph"></canvas>
                        </div>
                    </div>
                </section>

                <!-- event charge -->
                <section style="width:50%">
                    <div class="card">
                        <p>Charge de vos journées</p>

                        <div class="card-row" style="justify-content: space-between;">
                            <button id="charge-event-previous-week">Semaine precedente</button>
                            <button id="charge-event-next-week">Semaine suivante</button>
                        </div>


                        <div class="graph-wrapper">
                            <canvas id="graph-charge-event" class="graph"></canvas>
                        </div>
                    </div>
                </section>
            </secttion>



            <section>
                <header>
                    <h2>
                        Etat de vos propositions de rendez-vous
                    </h2>
                    <p id="subtitle-proposition-rdv">Vous avez x prosition de rendez-vous en cours</p>
                </header>

                <div id="input-cards-proposition-rdv">

                </div>
            </section>
        </main>
</body>

</html>
