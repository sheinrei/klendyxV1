<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de rendez-vous</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">

    <link rel="stylesheet" href="/css/generic.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">


    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous" defer></script>
    <script src="/js/navbar.js" defer></script>
    <script src="/js/footer.js" defer></script>
    <script src="/js/config.js" defer></script>
    <script src="/js/messageAlert.js" defer></script>
    <script src="/js/responsPropositionRdv.js" defer></script>

    <style>
        main {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #716af9, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }

        .header p {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 0;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            cursor: pointer;
            color: #1f2937;
        }

        textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-validate {
            background: linear-gradient(135deg, #716af9, #7c3aed);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background: linear-gradient(135deg, #5247c7, #6d28d9);
        }

        .btn-validate:active {
            transform: translateY(0);
        }

        .btn-refuse {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-refuse:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .btn-refuse:active {
            transform: translateY(0);
        }


        #message-alert p {
            padding: 12px;
            text-align: left;
            margin: 10px;
            white-space: pre-line !important;
            font-weight: 600;

        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <section class="content" id="content">
        <main>
            <div class="container">
                <div class="header">
                    <h1>Confirmation de rendez-vous</h1>
                    <p>Veuillez confirmer ou refuser ce rendez-vous</p>
                    <p id="message-alert"></p>
                </div>

                <form>
                    <div class="form-group">
                        <label for="response-message">Message (optionnel)</label>
                        <textarea id="response-message" name="response-message"
                            placeholder="Ajouter un message avec votre réponse..."></textarea>
                    </div>

                    <div class="button-group">
                        <button class="button btn-validate" type="submit" id="btn-accepter" name="action" value="true">
                            Accepter
                        </button>
                        <button class="button btn-refuse" type="submit" name="action" id="btn-refuser" value="false">
                            Refuser
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </section>
</body>

</html>
