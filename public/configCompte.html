<!DOCTYPE html>
<html lang="en">

<head>

    <title>Calendyx</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script src="./js/headConstruct.js"></script>


</head>

<body>
    <section class="content" id="content">

        <main>
            <header>
                <h1>Gestion du compte</h1>
            </header>

            <p id="noConnect"></p>


            <div id="user-info">


            </div>
        </main>
    </section>


    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            $("#noConnect").text("Veuillez vous connecter pour acceder à votre espace \"Gestion du compte\". Vous aller être redirigé vers la page d'acceuil dans quelques secondes.")

            setTimeout(() => window.location.href = "/index", 5000)
        } else {
            $.ajax({
                url: "/api/user/data",
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                },
                success: function (data) {
                    $("#user-info").html(`
                    <h2>Bienvenue ${data.prenom} ${data.nom}</h2>
                    <p>Email : ${data.email}</p>
                    <p>Entreprise : ${data.raisonSocial || "N/A"}</p>
                    <p>SIREN : ${data.siren || "N/A"}</p>
                    `)
                }

            })
        }
    </script>

    <script src="./js/navbar.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/deconnectUser.js"></script>
</body>

</html>
